name: Диагностика Steam
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Разобрать страницу рынка
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          B="https://steamcommunity.com/market/listings/570/Fractal%20Horns%20of%20Inner%20Abysm"
          {
            echo "время: $(date -u '+%d.%m.%Y %H:%M UTC')"
            echo "############ 1. обычная страница ?start=0&count=20"
            curl -sS -m 60 -H "User-Agent: $UA" -H "Accept: */*" -o /tmp/p0 "$B/?start=0&count=20"
            echo "байт: $(wc -c < /tmp/p0)"
            for k in listingid strSubtotal socket_item "Prismatic Gem" total_count; do
              echo "  вхождений '$k': $(grep -o "$k" /tmp/p0 | wc -l)"
            done
            echo "--- контекст первого listingid (900 символов):"
            grep -o 'listingid.\{0,900\}' /tmp/p0 | head -1
            echo
            echo "--- контекст первого strSubtotal (400):"
            grep -o '.\{150\}strSubtotal.\{250\}' /tmp/p0 | head -1
            echo
            echo "--- контекст socket_item (600):"
            grep -o '.\{200\}socket_item.\{400\}' /tmp/p0 | head -2
            echo
            echo "############ 2. страница ?start=20&count=20 — другие лоты?"
            curl -sS -m 60 -H "User-Agent: $UA" -H "Accept: */*" -o /tmp/p20 "$B/?start=20&count=20"
            echo "байт: $(wc -c < /tmp/p20) | listingid: $(grep -o listingid /tmp/p20 | wc -l)"
            echo "первые 3 id: $(grep -o 'listingid[^0-9]\{0,12\}[0-9]\{6,25\}' /tmp/p20 | head -3 | tr '\n' ' ')"
            echo "первые 3 id на start=0: $(grep -o 'listingid[^0-9]\{0,12\}[0-9]\{6,25\}' /tmp/p0 | head -3 | tr '\n' ' ')"
            echo
            echo "############ 3. render с X-Requested-With — отдаёт JSON?"
            curl -sS -m 60 -H "User-Agent: $UA" -H "X-Requested-With: XMLHttpRequest" \
                 -o /tmp/r1 "$B/render/?query=&start=0&count=20&currency=1&language=english&format=json"
            echo "байт: $(wc -c < /tmp/r1) | начало: $(head -c 120 /tmp/r1)"
            echo
            echo "############ 4. render без query/format"
            curl -sS -m 60 -H "User-Agent: $UA" -H "X-Requested-With: XMLHttpRequest" \
                 -o /tmp/r2 "$B/render/?start=0&count=20"
            echo "байт: $(wc -c < /tmp/r2) | начало: $(head -c 120 /tmp/r2)"
          } > scan.log 2>&1
          git checkout -q -B diag
          git add -f scan.log
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "разбор страницы рынка [skip ci]"
          git push -q -f origin diag

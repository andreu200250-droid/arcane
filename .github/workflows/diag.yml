name: Диагностика Steam
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Проверить параметр detail
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          B="https://steamcommunity.com/market/listings/570/Fractal%20Horns%20of%20Inner%20Abysm"
          {
            echo "время: $(date -u '+%d.%m.%Y %H:%M UTC')"
            curl -sS -m 60 -H "User-Agent: $UA" -o /tmp/p0 "$B/?start=0&count=20"
            echo "=== listingid на странице start=0:"
            grep -o 'listingid[^0-9]\{1,12\}[0-9]\{6,25\}' /tmp/p0 | head -5
            echo
            echo "=== id из ссылок пользователя есть среди них?"
            for id in 2805186240185775134 536648744054797752; do
              echo "  $id -> $(grep -c "$id" /tmp/p0) раз на странице"
            done
            echo
            echo "=== чем Steam помечает строку лота (id=listing_...):"
            grep -o 'id=\\"listing_[0-9]\{6,25\}\\"' /tmp/p0 | head -3
            echo
            echo "=== ссылка с detail=<наш listingid> — что отвечает Steam:"
            OUR=$(grep -o 'listingid[^0-9]\{1,12\}[0-9]\{6,25\}' /tmp/p0 | head -1 | grep -o '[0-9]\{6,25\}')
            echo "  берём listingid=$OUR"
            curl -sS -m 60 -H "User-Agent: $UA" -o /tmp/d1 "$B/?appid=570&sort=0&dir=0&detail=$OUR"
            echo "  HTTP-код и размер: $(wc -c < /tmp/d1) байт"
            echo "  есть ли на ней этот лот: $(grep -c "$OUR" /tmp/d1)"
            echo "  ошибка Steam: $(grep -ci 'an error was encountered' /tmp/d1)"
            echo
            echo "=== detail с заведомо nonexistent id:"
            curl -sS -m 60 -H "User-Agent: $UA" -o /tmp/d2 "$B/?appid=570&sort=0&dir=0&detail=1"
            echo "  размер: $(wc -c < /tmp/d2) байт | ошибка: $(grep -ci 'an error was encountered' /tmp/d2)"
            echo
            echo "=== что делает JS с detail (кусок кода):"
            grep -o '.\{80\}detail.\{200\}' /tmp/p0 | head -3
          } > scan.log 2>&1
          git checkout -q -B diag
          git add -f scan.log
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "проверка detail [skip ci]"
          git push -q -f origin HEAD:diag

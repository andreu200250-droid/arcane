name: Диагностика Steam
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Найти имя гема в разметке лота
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          B="https://steamcommunity.com/market/listings/570/Fractal%20Horns%20of%20Inner%20Abysm"
          {
            echo "время: $(date -u '+%d.%m.%Y %H:%M UTC')"
            curl -sS -m 60 -H "User-Agent: $UA" -o /tmp/p0 "$B/?start=0&count=20"
            echo "=== 1800 символов ПЕРЕД первым 'Prismatic Gem':"
            grep -o '.\{1800\}Prismatic Gem' /tmp/p0 | head -1
            echo
            echo "=== все имена 'Prismatic: X' на странице:"
            grep -o 'Prismatic: [A-Za-z'"'"' -]\{2,40\}' /tmp/p0 | sort | uniq -c
            echo
            echo "=== сколько раз встречается 'gem':"
            grep -o 'gem[^,]\{0,30\}' /tmp/p0 | sort | uniq -c | sort -rn | head -15
            echo
            echo "=== классы сокетов:"
            grep -o 'class=\\"[a-z_ ]*socket[a-z_ ]*\\"' /tmp/p0 | sort | uniq -c | head
            echo
            echo "=== 'socket' в любом виде:"
            grep -o '.\{120\}socket.\{200\}' /tmp/p0 | head -3
          } > scan.log 2>&1
          git checkout -q -B diag
          git add -f scan.log
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "разметка сокетов [skip ci]"
          git push -q -f origin diag

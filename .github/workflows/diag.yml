name: Диагностика Steam
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Проверить параметр detail
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          B="https://steamcommunity.com/market/listings/570/Fractal%20Horns%20of%20Inner%20Abysm"
          fetch() { curl -sS -m 60 -H "User-Agent: $UA" -H "Accept: */*" -o "$2" "$1"; sleep 4; }
          {
            echo "время: $(date -u '+%d.%m.%Y %H:%M UTC')"
            fetch "$B/?start=0&count=20" /tmp/p0
            echo "=== страница start=0: $(wc -c < /tmp/p0) байт | ошибка Steam: $(grep -ci 'an error was encountered' /tmp/p0 || true)"
            echo "=== listingid на странице:"
            grep -o 'listingid[^0-9]\{1,12\}[0-9]\{6,25\}' /tmp/p0 | head -5 || true
            echo
            echo "=== id из ссылок пользователя есть среди них?"
            for id in 2805186240185775134 536648744054797752; do
              echo "  $id -> $(grep -c "$id" /tmp/p0 || true) раз"
            done
            echo
            OUR=$(grep -o 'listingid[^0-9]\{1,12\}[0-9]\{6,25\}' /tmp/p0 | head -1 | grep -o '[0-9]\{6,25\}' || true)
            echo "=== ссылка с detail=<наш listingid $OUR>:"
            fetch "$B/?appid=570&sort=0&dir=0&detail=$OUR" /tmp/d1
            echo "  $(wc -c < /tmp/d1) байт | ошибка Steam: $(grep -ci 'an error was encountered' /tmp/d1 || true) | лот на странице: $(grep -c "$OUR" /tmp/d1 || true)"
            echo "  первые лоты страницы: $(grep -o 'listingid[^0-9]\{1,12\}[0-9]\{6,25\}' /tmp/d1 | head -2 | tr '\n' ' ')"
            echo
            echo "=== detail с заведомо nonexistent id:"
            fetch "$B/?appid=570&sort=0&dir=0&detail=1" /tmp/d2
            echo "  $(wc -c < /tmp/d2) байт | ошибка Steam: $(grep -ci 'an error was encountered' /tmp/d2 || true)"
            echo "  первые лоты страницы: $(grep -o 'listingid[^0-9]\{1,12\}[0-9]\{6,25\}' /tmp/d2 | head -2 | tr '\n' ' ')"
            echo
            echo "=== чем Steam помечает строку лота:"
            grep -o 'id=\\"listing_[0-9]\{6,25\}\\"' /tmp/p0 | head -3 || true
            echo "=== готово"
          } > scan.log 2>&1
          git checkout -q -B diag
          git add -f scan.log
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "проверка detail [skip ci]" || echo "нечего коммитить"
          git push -q -f origin HEAD:diag || echo "пуш журнала не удался"

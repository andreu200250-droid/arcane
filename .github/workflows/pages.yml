
# =============================================================================
#  Dota 2 · монитор «аркана + самоцвет» — версия ОДНИМ ФАЙЛОМ
#  Всё внутри: скан Steam Community Market, расчёт выгоды и генерация страницы.
#  Кладите этот файл по пути:  .github/workflows/pages.yml
#  Затем: Settings → Pages → Source = "GitHub Actions" (или шаг configure-pages
#  включит сам) и Actions → Run workflow.
# =============================================================================
name: Дашборд арканы с самоцветом

on:
  schedule:
    # Каждые 5 минут. Steam пускает к рынку не с каждого адреса GitHub Actions:
    # удачный прогон выпадает примерно в трети случаев, поэтому чем чаще пробуем,
    # тем меньше снимок успевает устареть. Одна заблокированная попытка стоит
    # 4–8 запросов и ~2–3 минуты, так что стучаться чаще дешево.
    - cron: "*/5 * * * *"          # GitHub может задерживать запуск на минуты
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Скан Steam и сборка страницы
        shell: bash
        run: |
          # Адрес прогона — в журнал скана: по нему видно, с каких адресов Steam
          # не пускает, а с каких пускает. Если сервис недоступен — не беда.
          RUN_IP="$(curl -s --max-time 10 https://api.ipify.org || echo неизвестно)"
          export RUN_IP
          python3 - <<'PY'
          import os, subprocess, re, json, time, pathlib, html
          from urllib.parse import quote, unquote

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
          RATE = 82.57            # ₽ за $1 (курс Steam, срез 10.11.2026)
          # Сканируем только аркану Terrorblade. Аркана Techies (Swine of the Sunken
          # Galley) убрана: лотов с самоцветом на ней не находится (0 ₽ в шапке сайта),
          # а сканы её версий съедали время всего прогона — из-за этого сканал успевал
          # меньше данных, чем мог бы.
          ARC = [("Terrorblade", "Fractal Horns of Inner Abysm", "Reflection's Shade")]
          _last = [0.0]
          THROTTLE = 3.0          # пауза между запросами к Steam, сек
          SCAN_LIMIT = 420        # максимум на весь скан, сек (диспатч каждые 10 минут:
                                   # здоровый скан одной арканы идёт ~4 мин — страницы
                                   # лотов весят по 700 КБ; остальное — запас на повторы
                                   # и на цены продаж самоцветов)
          SALE_GAP = 1.5          # пауза перед ценами продаж: эндпоинт лёгкий, отдаёт JSON
          SALE_MAX = 40           # сколько гемов максимум дотягиваем до цен продаж за скан
          THIN = 2                # сколько заявок — ещё «тонкий рынок»: одна заявка врёт
          CACHE = "gem-prices.json"   # цены последних зафиксированных продаж, живёт в main
          LOG = []


          def log(msg):
              print(msg)
              LOG.append(msg)


          def flush_log():
              try:
                  pathlib.Path("scan.log").write_text("\n".join(LOG), encoding="utf-8")
              except Exception:
                  pass


          DEADLINE = [1e18]


          def nap(sec):
              """Пауза, которая не переходит за дедлайн скана: когда время вышло,
              спать незачем — сразу отдаём отказ и переходим к следующему адресу."""
              left = DEADLINE[0] - time.time()
              time.sleep(max(0.0, min(sec, left)))


          # Когда Steam не пускает к страницам лотов, скан останавливается почти
          # сразу: четыре отказа подряд — этот прогон попал на адрес, который Steam
          # не пускает, и просить дальше бессмысленно. Прогон при этом зелёный, сайт
          # остаётся на прошлом снимке, а следующий диспатч попробует с нового адреса.
          # Повторы внутри прогона дело не спасают (адрес у прогона один), зато каждый
          # лишний запрос продлевает блокировку — поэтому при отказе ничего не просим,
          # пока она не отпустит, и после четвёртого отказа скан просто встаёт.
          PROBE_LIMIT = 4             # столько отказов подряд — и скан остановлен
          BLOCK = [0.0]               # Steam сердится: до этого времени не просим ничего
          STOP = [False]              # Steam не пускает: дальше просить бессмысленно
          PROBE = [0]                 # отказов подряд на страницах лотов


          def get(url, tries=4, want=None, gap=None):
              code, why = "", "нет ответа"
              lots = "/market/listings/" in url
              for attempt in range(tries):
                  if time.time() > DEADLINE[0]:
                      raise RuntimeError("время скана вышло")
                  if lots and STOP[0]:
                      raise RuntimeError("Steam не пускает к страницам лотов")
                  # Steam сердится: до этого времени не просим ничего, иначе серия
                  # отказов только продлевает блокировку
                  if BLOCK[0] > time.time():
                      nap(BLOCK[0] - time.time())
                  wait = (gap or THROTTLE) - (time.time() - _last[0])
                  if wait > 0:
                      time.sleep(wait)
                  _last[0] = time.time()
                  p = subprocess.run(["curl", "-sS", "-m", "45", "-H", "User-Agent: " + UA,
                                      "-H", "Accept: */*", "-w", "\n%{http_code}", url],
                                     capture_output=True)
                  body, _, code = p.stdout.decode("utf-8", "replace").rpartition("\n")
                  c = code.strip()
                  log("  GET %s -> %s" % (url.split("?")[0][-45:], c or "нет ответа"))
                  if c == "200":
                      # Steam иногда отвечает страницей ошибки с кодом 200 и без лотов
                      if want and want not in body:
                          why = "страница без данных (%s)" % want
                          log("  %s — повтор %d/%d" % (why, attempt + 1, tries))
                          nap(20 + 15 * attempt)   # 20, 35, 50, 65 с
                          continue
                      if lots:
                          PROBE[0] = 0        # пустили — дальше обычные повторы
                      return body
                  why = "HTTP %s" % (c or "нет ответа")
                  # 429 от Steam: не просим ничего, пока блокировка не отпустит, и
                  # считаем отказы подряд. Четыре подряд на страницах лотов — значит,
                  # Steam не пускает нас вообще: скан останавливается, потому что
                  # продолжать бессмысленно, а повторы продлевают блокировку
                  pause = (20 + 20 * attempt) if c == "429" else (15 + 10 * attempt)
                  if c == "429":
                      BLOCK[0] = time.time() + pause
                      if lots:
                          PROBE[0] += 1
                          if PROBE[0] >= PROBE_LIMIT:
                              STOP[0] = True
                              log("  Steam не пускает к страницам лотов — скан остановлен")
                  # после последней попытки спать незачем: сразу отдаём отказ наверх,
                  # иначе мёртвый адрес съедает лимит скана ни за чем
                  log("  попытка %d/%d не удалась (%s)%s"
                      % (attempt + 1, tries, why,
                         ", ждём %d с" % pause if attempt + 1 < tries else " — сдаёмся"))
                  if attempt + 1 < tries:
                      nap(pause)
              raise RuntimeError("%s %s" % (why, url[:80]))


          def unesc(s):
              s = s.replace('\\\\\\"', '\x01').replace('\\\\"', '"').replace('\\"', '"').replace('\x01', '"')
              return s.replace('\\u003c', '<').replace('\\u003e', '>').replace('\\u0026', '&')


          SOCK = re.compile(r'>([^<]{2,48})</span><br><span style="font-size: 12px">([^<]+)</span>')


          def parse_page(h):
              out = []
              for chunk in h.split('listingid')[1:]:
                  sub = unesc(chunk[:20000])
                  mp = re.search(r'strSubtotal":"(\$[\d,\.]+)"', sub)
                  if not mp:
                      continue
                  lm = re.search(r'(\d{6,25})', sub[:40])
                  gem = None
                  for gname, gtype in SOCK.findall(sub):
                      if gtype.strip().lower() == "prismatic gem":
                          gem = gname.strip()
                          break
                  out.append({"price": float(mp.group(1).replace("$", "").replace(",", "")),
                              "gem": gem, "id": lm.group(1) if lm else ""})
              return out


          def page_stat(body):
              """Сколько в ответе Steam сырых лотов и распознанных — для журнала скана."""
              return "%d КБ, listingid x%d, strSubtotal x%d" % (
                  len(body) // 1024, body.count("listingid"), body.count("strSubtotal"))


          def listings(name):
              # Steam отдаёт лоты на обычной странице рынка: /render/ больше не отдаёт их все.
              # Count=100 не помогает: в разметке остаются только первые 20 лотов страницы,
              # поэтому листание по 20 — так проверенная версия и собирала все лоты.
              base = "https://steamcommunity.com/market/listings/570/" + quote(name)
              PAGE = 20
              total, rows = 0, []
              for attempt in range(2):
                  # currency=1 — иначе Steam отдаёт цены в валюте по адресу прогона
                  # (у GitHub Actions бывает канадский доллар), и разбор молча
                  # теряет все лоты: цена перестаёт начинаться с «$»
                  first = get(base + "?start=0&count=%d&currency=1" % PAGE, want="listingid")
                  m = re.search(r'total_count[^0-9]{1,8}(\d{1,7})', first)
                  total = int(m.group(1)) if m else 0
                  rows = parse_page(first)
                  log("  %s: страница 0 — %s, всего лотов %d" % (name, page_stat(first), total))
                  # цена лота разбирается только если она в долларах: если Steam
                  # отдал валюту по адресу прогона, в журнане будет видно почему
                  for cur in ("CA$", "A$", "NZ$", "S$", "R$", "£", "€", "¥"):
                      if cur in first:
                          log("  %s: цена пришла не в долларах (%s) — лоты не разобрать"
                              % (name, cur))
                          break
                  # Steam сказал, что лоты есть, а страница пустая — берём её ещё раз
                  if rows or not total or attempt:
                      break
                  log("  страница пустая при total_count=%d — повтор" % total)
                  nap(10)
              for start in range(PAGE, total, PAGE):
                  if STOP[0]:
                      log("  Steam не пускает — остальные страницы не прошу")
                      break
                  if time.time() > DEADLINE[0]:
                      log("  время скана вышло — остальные страницы пропускаю")
                      break
                  chunk = []
                  for attempt in range(2):
                      try:
                          body = get(base + "?start=%d&count=%d&currency=1" % (start, PAGE),
                                   want="listingid")
                          chunk = parse_page(body)
                          log("  %s: страница %d — %s, разобрано %d" % (name, start, page_stat(body), len(chunk)))
                          if len(chunk) >= min(PAGE, total - start):
                              break
                          log("  страница start=%d короткая (%d из %d лотов) — повтор"
                              % (start, len(chunk), min(PAGE, total - start)))
                      except RuntimeError as e:
                          log("  start=%d: %s" % (start, e))
                      nap(10)
                  if not chunk:
                      log("  страница start=%d так и не отдалась — дальше не иду" % start)
                      break
                  rows += chunk
              log("  %s: разобрано %d лотов, с самоцветом %d" % (name, len(rows), sum(1 for r in rows if r["gem"])))
              seen, uniq = set(), []
              for i, r in enumerate(rows):
                  k = (r["price"], r["gem"])
                  if k not in seen:
                      seen.add(k)
                      r["idx"] = i          # позиция лота в выдаче Steam — для start
                      uniq.append(r)
              page = "https://steamcommunity.com/market/listings/570/" + quote(name)
              for r in uniq:
                  # Ссылка на конкретный лот: detail=<id лота>. start показывает ту страницу
                  # выдачи, на которой лот находится (start обязан быть кратен 20)
                  r["url"] = page + ("?appid=570&sort=0&dir=0&start=%d&detail=%s"
                                     % (r["idx"] // 20 * 20, r["id"]) if r["id"] else "")
              return uniq


          def search_items(q):
              """Товары рынка по слову — со страницы поиска. Раньше это отдавал
              /search/render/ JSON'ом, но Steam его убрал и страницу поиска
              переделал: классы в её разметке хешированы и меняются с каждым
              деплоем, поэтому опираемся только на текст. Имя товара — из ссылки
              на его лот, тип — из первой подписи карточки, число заявок и цена —
              из подписей «Quantity for sale» и «From $». currency=1 — иначе Steam
              отдаст цены в валюте по адресу прогона, а не в долларах."""
              url = ("https://steamcommunity.com/market/search?q=%s&appid=570&currency=1"
                     % quote(q))
              body = get(url, tries=2, want="Quantity for sale")
              out = []
              # каждая карточка товара — ссылка на его лот; всё до следующей
              # ссылки принадлежит этой карточке
              for chunk in re.split(r'<a href="https://steamcommunity\.com/market/listings/570/',
                                    body)[1:]:
                  href = chunk.split('"', 1)[0]
                  m_qty = re.search(r'Quantity for sale:\s*<span[^>]*>\s*([\d,]+)\s*</span>', chunk)
                  m_price = re.search(r'From \$([\d,]+(?:\.\d+)?)', chunk)
                  if not (m_qty and m_price):
                      continue        # не карточка товара, а ссылка из другого места
                  m_type = re.search(r'<span[^>]*>([^<]{2,60})</span>', chunk)
                  out.append({"name": unquote(html.unescape(href)),
                              "type": (m_type.group(1).strip() if m_type else ""),
                              "n": int(m_qty.group(1).replace(",", "")),
                              "ask": float(m_price.group(1).replace(",", ""))})
              return out


          def gems():
              """Цены гемов: самая дешёвая заявка и число лотов — со страницы поиска."""
              out = {}
              try:
                  items = search_items("prismatic")
              except Exception as e:
                  # Поиск не отдался: цены гемов добудем из priceoverview по ходу
                  # скана (ask_price), снимок при этом всё равно соберётся
                  log("  поиск гемов не отдался: %s — заявки возьму из priceoverview" % e)
                  return out
              for it in items:
                  n = it["name"]
                  if n.startswith("Prismatic: "):
                      out[n[11:]] = {"ask": it["ask"], "n": it["n"]}
              if not out:
                  # Поиск ответил, но самоцветов в нём нет — цены всё равно
                  # добудем из priceoverview по ходу скана
                  log("  поиск гемов не отдал ни одного самоцвета — "
                      "заявки возьму из priceoverview")
              return out


          def variants(name):
              """Все версии одной и той же арканы: базовая, Exalted, Inscribed, Corrupted,
              Autographed, Auspicious... Версия — предмет того же типа (Arcana Demon Horns),
              поэтому «- Horns», «- Bundle» и прочие отдельные
              предметы с похожим названием сюда не попадают."""
              out = []
              try:
                  items = search_items(name)
              except Exception as e:
                  # Поиск не отдался: версии проверим напрямую (probe_variants)
                  log("  версии %s через поиск не нашлись: %s" % (name, e))
                  return [name]
              base_type = next((i["type"] for i in items if i["name"] == name), "")
              for it in items:
                  h = it["name"]
                  if h == name:
                      out.append(h)
                  # версия — то же название с одним словом впереди и без отдельной
                  # детали (« - Horns», « - Bundle»): «Fractal Horns - Horns» не версия
                  elif (name in h and " - " not in h and h not in out
                        and re.match(r"^[A-Z][A-Za-z']* %s$" % re.escape(name), h)
                        and (not base_type or it["type"] == base_type)):
                      out.append(h)
              if name not in out:             # поиск не отдал базовую — сканируем только её
                  out = [name]
              return out


          def overview(name):
              """priceoverview по гему: цена продажи (медиана и объём) и самая
              дешёвая заявка. Отдаёт None, если Steam не ответил."""
              url = ("https://steamcommunity.com/market/priceoverview/?appid=570"
                     "&market_hash_name=%s&currency=1" % quote("Prismatic: " + name))
              try:
                  d = json.loads(get(url, tries=2, want='"success":true', gap=SALE_GAP))
                  if not d.get("lowest_price") and not d.get("median_price"):
                      return None           # такого гема на рынке нет
                  return {"low": d.get("lowest_price") or "",
                          "vol": int(str(d.get("volume") or "0").replace(",", "") or 0),
                          "med": d.get("median_price") or ""}
              except Exception as e:
                  log("  заявка %s: %s" % (name, e))
                  return None


          def ask_price(name):
              """Самая дешёвая заявка гема — запас на случай, когда страница поиска
              не отдалась: цена гема нужна и тогда, когда продаж в окне нет."""
              o = overview(name)
              low = (o["low"] if o else "").replace("$", "").replace(",", "")
              return float(low) if low else None


          def probe_variants(name):
              """Запас: страница поиска не отдалась — проверяем известные префиксы
              версий арканы через priceoverview (лёгкий JSON). Версия есть на рынке —
              сканируем её лоты, иначе пропускаем."""
              out = []
              for p in ("Exalted", "Inscribed", "Corrupted", "Autographed", "Auspicious",
                        "Genuine"):
                  v = "%s %s" % (p, name)
                  url = ("https://steamcommunity.com/market/priceoverview/?appid=570"
                         "&market_hash_name=%s&currency=1" % quote(v))
                  try:
                      d = json.loads(get(url, tries=1, want='"success":true', gap=SALE_GAP))
                  except Exception:
                      continue
                  if d.get("lowest_price") or d.get("median_price"):
                      out.append(v)
                      log("  версия на рынке: %s" % v)
              return out


          def ver_suffix(vname, name):
              """« · Inscribed», « · Exalted» — чем версия отличается от базовой."""
              if not vname or vname == name:
                  return ""
              return " · " + vname[:len(vname) - len(name)].strip(" -")


          def load_cache():
              """Последние зафиксированные нами цены продаж: без них тонкому рынку
              снова останется одна заявка вместо последней сделки."""
              try:
                  d = json.loads(pathlib.Path(CACHE).read_text(encoding="utf-8"))
                  return d if isinstance(d, dict) else {}
              except Exception:
                  return {}


          def save_cache(c):
              try:
                  out = pathlib.Path("public")
                  out.mkdir(exist_ok=True)
                  (out / CACHE).write_text(json.dumps(c, ensure_ascii=False, sort_keys=True),
                                           encoding="utf-8")
              except Exception:
                  pass


          def ymd():
              """Сегодня в Екатеринбурге — дата цены, снятой с продаж."""
              return time.strftime("%d.%m.%Y", time.gmtime(time.time() + 5 * 3600))


          def sale(name):
              """Цена гема по фактическим продажам: Steam держит её в priceoverview
              (медиана продаж и их объём). None — продаж в окне нет, False — отказ."""
              url = ("https://steamcommunity.com/market/priceoverview/?appid=570"
                     "&market_hash_name=%s&currency=1" % quote("Prismatic: " + name))
              try:
                  body = get(url, tries=2, want='"success":true', gap=SALE_GAP)
                  d = json.loads(body)
                  vol = int(str(d.get("volume") or "0").replace(",", "") or 0)
                  med = (d.get("median_price") or "").replace("$", "").replace(",", "")
                  if vol <= 0 or not med:
                      return None
                  return {"v": float(med), "n": vol}
              except Exception as e:
                  log("  продажи %s: %s" % (name, e))
                  return False


          def enrich(g, cache, need):
              """Основа оценки гема: свежие продажи Steam, иначе последняя
              зафиксированная нами продажа (с датой), иначе самая дешёвая заявка.
              Отдаёт {гем: {"v", "d", "sale"}} — «sale» значит «цена по сделкам»."""
              out, fails = {}, 0
              # тонкие рынки первыми: именно у них заявка одна и врёт сильнее всего
              names = sorted(need, key=lambda x: (g[x]["n"] is None, g[x]["n"] or 0))[:SALE_MAX]
              for name in names:
                  if STOP[0] or time.time() > DEADLINE[0]:
                      log("  продажи: Steam не пускает или время вышло — "
                          "остальным гемам цена из кеша или предложения")
                      break
                  if fails >= 3:
                      # три отказа подряд на ценах продаж — этот эндпоинт нам сегодня
                      # не отвечает; просить дальше значит продлевать блокировку
                      log("  Steam не пускает к ценам продаж — дальше из кеша или предложения")
                      break
                  s = sale(name)
                  if s:
                      fails = 0
                      cache[name.lower()] = {"v": s["v"], "d": ymd(), "n": s["n"]}
                      out[name] = {"v": s["v"], "d": ymd(), "sale": True}
                      log("  %s: продажа %s (объём %d)" % (name, rub(s["v"]), s["n"]))
                      continue
                  if s is False:
                      fails += 1          # Steam не ответил — это отказ, их и считаем
                  else:
                      fails = 0           # продаж в окне нет — связь живая, не отказ
                  c = cache.get(name.lower())
                  if c:
                      out[name] = {"v": c["v"], "d": c.get("d", "?"), "sale": True}
                      log("  %s: свежих продаж нет — цена по последней "
                          "зафиксированной (%s)" % (name, c.get("d", "?")))
                  else:
                      out[name] = {"v": g[name]["ask"], "d": "", "sale": False}
                      # число заявок неизвестно (взяли его из priceoverview) —
                      # в журнале это и напишем
                      log("  %s: продаж нет — цена по предложению%s"
                          % (name, " (%d лот(ов))" % g[name]["n"] if g[name]["n"] else ""))
              # гемам вне списка (кап или отказ по дороге) — та же лестница без свежих продаж
              for name in need:
                  if name in out:
                      continue
                  c = cache.get(name.lower())
                  if c:
                      out[name] = {"v": c["v"], "d": c.get("d", "?"), "sale": True}
                  else:
                      out[name] = {"v": g[name]["ask"], "d": "", "sale": False}
              return out


          def rub(usd):
              return "{:,}".format(round(usd * RATE)).replace(",", "\u2009") + " \u20bd"


          def main():
              DEADLINE[0] = time.time() + SCAN_LIMIT
              log("прогон с адреса %s" % os.environ.get("RUN_IP", "неизвестно"))
              print("scan: gems")
              # Поиск мог не отдаться — это не беда: заявки гемов тогда добудем
              # из priceoverview (ask_price), снимок всё равно соберётся
              g = gems()
              cache = load_cache()
              deals, base = [], {}
              for hero, name, default_gem in ARC:
                  if STOP[0]:
                      break
                  print("scan:", hero)
                  lots = []
                  # сначала базовая версия: её данные уже стоят на сайте, её терять нельзя
                  try:
                      got = listings(name)
                  except Exception as e:
                      print("  скан %s не удался: %s" % (name, e))
                      got = []
                  for l in got:
                      l["ver"] = name
                  lots += got
                  # потом остальные версии той же арканы: Exalted, Inscribed, Corrupted...
                  if STOP[0]:
                      log("  Steam не пускает — версии не ищу")
                      continue
                  try:
                      vlist = [v for v in variants(name) if v != name]
                  except Exception as e:
                      print("  версии %s не нашлись: %s" % (name, e))
                      vlist = []
                  if not vlist:
                      # Поиск версий не отдался — проверяем известные префиксы
                      # напрямую: Exalted, Inscribed, Corrupted...
                      vlist = probe_variants(name)
                  for vname in vlist:
                      if STOP[0]:
                          log("  Steam не пускает — остальные версии не прошу")
                          break
                      if time.time() > DEADLINE[0]:
                          log("  время скана вышло — остальные версии пропускаю")
                          break
                      log("  версия: %s" % vname)
                      try:
                          got = listings(vname)
                      except Exception as e:
                          log("  скан %s не удался: %s" % (vname, e))
                          continue
                      for l in got:
                          l["ver"] = vname
                      lots += got
                  log("  %s: версий просканировано %d, лотов %d, с самоцветом %d"
                      % (hero, len(vlist) + 1, len(lots), sum(1 for l in lots if l["gem"])))
                  if not lots:
                      print("  лотов нет — аркана пропущена")
                      continue
                  # цена гема по продажам: свежие сделки Steam, иначе последняя
                  # зафиксированная, иначе заявка. Дефолтный гем не считаем —
                  # его лоты в таблицу не попадают
                  need = {l["gem"] for l in lots
                          if l.get("gem") and l["gem"] != default_gem}
                  # Гемам, которых не отдала страница поиска, — заявку из
                  # priceoverview: иначе лоты с такими самоцветами выпали бы
                  # из таблицы совсем
                  for nm in sorted(need):
                      if nm in g:
                          continue
                      a = ask_price(nm)
                      if a:
                          # число заявок неизвестно — None, а not выдуманное число:
                          # в таблице такое не показываем вовсе
                          g[nm] = {"ask": a, "n": None}
                          log("  %s: поиск не отдал — заявка %s из priceoverview"
                              % (nm, rub(a)))
                  need = {n for n in need if n in g}
                  print("scan: sale")
                  S = enrich(g, cache, need)
                  # версии одной арканы — по сути один предмет: пара цена+гем не дублируется
                  seen, uniq = set(), []
                  for l in lots:
                      k = (l["price"], l["gem"])
                      if k not in seen:
                          seen.add(k)
                          uniq.append(l)
                  lots = uniq
                  b = min(l["price"] for l in lots)
                  base[hero] = (b, ver_suffix(min(lots, key=lambda x: x["price"])["ver"], name))
                  for l in lots:
                      if not l["gem"] or l["gem"] not in g:
                          continue
                      gi = g[l["gem"]]
                      s = S.get(l["gem"]) or {"v": gi["ask"], "d": "", "sale": False}
                      gp = s["v"]
                      gn = gi["n"]
                      setp = b + gp
                      deals.append({"hero": hero + ver_suffix(l["ver"], name),
                                    "gem": l["gem"], "price": l["price"], "gemv": gp,
                                    "n": gn, "setp": setp, "save": setp - l["price"],
                                    "pct": 100.0 * (setp - l["price"]) / setp,
                                    "def": l["gem"] == default_gem, "url": l["url"],
                                    "sale": s["sale"], "sd": s.get("d", "")})
              if not deals:
                  # Публиковать нечего: сайт остаётся на прошлом снимке, а прогон
                  # остаётся зелёным — следующий диспатч через 10 минут попробует снова
                  log("СБОЙ: Steam не отдал ни одного лота с гемом — "
                      "оставлен прошлый снимок сайта, прогон не роняем")
                  return
              deals.sort(key=lambda d: -d["save"])

              live = [d for d in deals if not d["def"]]
              # в карточки — только лоты, выгодные при оценке гема по продажам:
              # оценка по одной заявке прибыль не создаёт, она её придумывает
              good = [d for d in live if d["save"] > 0 and d["sale"]]
              if not good:
                  good = [d for d in live if d["save"] > 0]
              best = max(good, key=lambda d: d["save"]) if good else None
              pct = max(good, key=lambda d: d["pct"]) if good else None
              rich = [d for d in good if d["pct"] >= 15]
              cheap = min(rich or good, key=lambda d: d["price"]) if good else None

              def basis_text(d):
                  """Чем оперта цена гема: сделками (и какой давности) или заявкой."""
                  if d["sale"]:
                      return " по продажам" + ("" if d["sd"] == ymd() else " (%s)" % d["sd"])
                  return " по предложению" + (", заявок: %d" % d["n"]
                                              if d["n"] and d["n"] <= THIN else "")

              def card(d, tag, cls=""):
                  if not d:
                      return ""
                  return ('<div class="card %s"><div class="tag">%s</div>'
                          '<div class="big">%s</div><div class="gem"><i style="background:%s"></i>%s &middot; %s</div>'
                          '<div class="small">гем отдельно %s%s &middot; собрать самому %s<br>'
                          '<span class="%s">выгода %s (%d%%)</span><br>'
                          '<a class="lnk" href="%s" target="_blank" rel="noopener">открыть лот на Steam &#8599;</a>'
                          '</div></div>'
                          % (cls, tag, rub(d["price"]), color(d["gem"]), d["gem"], d["hero"],
                             rub(d["gemv"]), basis_text(d), rub(d["setp"]),
                             "pos" if d["save"] >= 0 else "neg", rub(d["save"]),
                             round(d["pct"]), d["url"]))

              if live and not good:
                  # ни один лот не выгоден при честных ценах гемов — так и скажем
                  cards = ('<div class="card"><div class="tag">максимальная выгода в рублях</div>'
                           '<div class="big">0 &#8381;</div>'
                           '<div class="small">по ценам фактических продаж самоцветов выгодных '
                           'сборок нет: собрать самому выходит дороже любого готового лота</div></div>')
              else:
                  cards = (card(best, "максимальная выгода в рублях")
                           + card(pct, "лучший процент", "c2")
                           + card(cheap, "самый дешёвый вход (&ge;15%)" if rich
                                  else "самый дешёвый вход", "c3"))

              def table_basis(d):
                  if d["sale"]:
                      return "по продажам" + ("" if d["sd"] == ymd() else " %s" % d["sd"])
                  return "по предложению" + (", заявок: %d" % d["n"]
                                             if d["n"] and d["n"] <= THIN else "")

              def lots_of(d):
                  """Сколько лотов у гема. Число заявок неизвестно (поиск не
                  отдался) — подпись не показываем: выдуманное число хуже её
                  отсутствия."""
                  return " &middot; гемов: %d" % d["n"] if d["n"] else ""

              rows = []
              for d in deals:
                  if d["def"]:
                      continue
                  rows.append(
                      '<tr data-gem="%s" data-price="%d" data-save="%d" data-pct="%d">'
                      '<td><b>%s</b><div class="mut">$%.2f</div></td>'
                      '<td><i style="background:%s"></i>%s<div class="mut">%s%s</div></td>'
                      '<td class="num">%s<div class="mut">%s</div></td>'
                      '<td class="num mut">%s</td>'
                      '<td class="num %s">%s%s<div class="mut">%d%%</div></td></tr>'
                      % (d["gem"].lower(), round(d["price"] * RATE), round(d["save"] * RATE), round(d["pct"]),
                         rub(d["price"]), d["price"], color(d["gem"]), d["gem"],
                         d["hero"], lots_of(d), rub(d["gemv"]), table_basis(d), rub(d["setp"]),
                         "pos" if d["save"] >= 0 else "neg",
                         "&minus;" if d["save"] < 0 else "", rub(abs(d["save"])), round(d["pct"])))
              def cheap_line(hero):
                  p, v = base.get(hero, (0, ""))
                  return rub(p) + v


              # Екатеринбург: UTC+5, перехода на летнее время в городе нет
              stamp = time.strftime("%d.%m.%Y %H:%M ЕКБ", time.gmtime(time.time() + 5 * 3600))
              page = (TEMPLATE
                      .replace("%%CARDS%%", cards)
                      .replace("%%ROWS%%", "".join(rows))
                      .replace("%%STAMP%%", stamp)
                      .replace("%%COUNT%%", str(len(deals)))
                      .replace("%%TB%%", cheap_line("Terrorblade"))
                      .replace("%%GEMS%%", str(len(S)))
                      .replace("%%SALES%%", str(sum(1 for v in S.values() if v["sale"]))))
              out = pathlib.Path("public")
              out.mkdir(exist_ok=True)
              (out / "index.html").write_text(page, encoding="utf-8")
              save_cache(cache)
              print("public/index.html: %d лотов с гемом" % len(deals))


          COLORS = {"orange": "#ff8a3d", "ember flame": "#ff5a2e", "light green": "#a6e05a",
                    "earth green": "#4a8f4a", "deep green": "#1f6b3a", "purple": "#8b3dd6",
                    "bright purple": "#b45cff", "blue": "#2d7dff", "deep blue": "#1f4fd6",
                    "crystalline blue": "#59c6e0", "ships in the night": "#1d2b52",
                    "dungeon doom": "#7a3f2a", "miasmatic grey": "#6f7a6a", "plague grey": "#8a9a7a",
                    "cursed black": "#20232a", "plushy shag": "#c96fa8", "rubiline": "#c02040",
                    "blossom red": "#e0304f", "red": "#c2263a", "gold": "#d4a338",
                    "explosive burst": "#ff6b1a", "unhallowed ground": "#4a4a6a",
                    "dredge earth": "#6b5a3a", "diretide orange": "#f08030",
                    "brusque britches beige": "#c2a97a", "vermillion renewal": "#e04a1a",
                    "champion's purple": "#9b5cff", "champion's blue": "#4a7cff",
                    "champion's green": "#2fae6a", "sea green": "#3fbfa8", "summer warmth": "#ffb347",
                    "placid blue": "#6d9fd6", "bright green": "#37e06a", "verdant green": "#5fbf7a",
                    "reflection's shade": "#ff3c28", "tnim s'nnam": "#3fa0a0",
                    "glacial flow": "#8ee6ff", "pyroclastic flow": "#ff4a1a", "midas gold": "#e8b93c",
                    "creator's light": "#fff2c2"}


          def color(g):
              return COLORS.get(g.lower(), "#6cb6ff")


          TEMPLATE = """<!DOCTYPE html>
          <html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Dota 2: аркана + самоцвет &mdash; выгода</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#0b0e13;color:#e7ebf2;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial}
          .wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
          h1{font-size:20px;margin:0 0 4px}
          .sub{color:#8794a8;font-size:12.5px;margin:0 0 18px}
          .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
          .card{background:#141922;border:1px solid #232c3a;border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
          .card:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:#4fd18b}
          .card.c2:before{background:#6cb6ff}.card.c3:before{background:#a97ede}
          .card .tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8794a8;font-weight:700}
          .card .big{font-size:23px;font-weight:800;margin:4px 0 2px}
          .card .gem{font-size:13px;font-weight:600}
          .card .small{font-size:11.5px;color:#8794a8;margin-top:7px}
          .pos{color:#4fd18b;font-weight:700}
          .neg{color:#e0655a;font-weight:700}
          .lnk{color:#6cb6ff;font-weight:600;text-decoration:none}
          .mut{color:#7f8b9d;font-size:11px}
          i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
          .bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
          input,select{font:inherit;font-size:13px;background:#141922;border:1px solid #232c3a;color:#e7ebf2;border-radius:9px;padding:8px 10px}
          input{width:200px}
          table{width:100%;border-collapse:collapse;font-size:13.5px;background:#141922;border-radius:12px;overflow:hidden}
          th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8794a8;padding:10px;border-bottom:1px solid #232c3a}
          td{padding:9px 10px;border-bottom:1px solid #1a2230}
          tr:hover{background:#171f2b}
          .num{text-align:right;white-space:nowrap}
          a{color:#6cb6ff;text-decoration:none}
          .foot{color:#7f8b9d;font-size:11.5px;margin-top:20px;line-height:1.6;border-top:1px solid #232c3a;padding-top:14px}
          @media(max-width:800px){.cards{grid-template-columns:1fr}}
          </style></head><body><div class="wrap">
          <h1>Dota 2: аркана с самоцветом &mdash; где выгода</h1>
          <p class="sub">Снимок Steam Community Market: %%STAMP%% &middot; лотов с гемом: %%COUNT%% &middot;
          гемов в сокетах: %%GEMS%% &middot; из них по продажам: %%SALES%% &middot; дешёвая аркана: Terrorblade %%TB%%.
          Обновляется автоматически по расписанию GitHub Actions.</p>
          <div class="cards">%%CARDS%%</div>
          <div class="bar">
            <input id="q" placeholder="Поиск по самоцвету&hellip;" oninput="f()">
            <select id="s" onchange="f()">
              <option value="save">сортировка: выгода</option>
              <option value="pct">выгода %</option>
              <option value="price">цена</option>
            </select>
          </div>
          <table id="t"><thead><tr><th>Лот</th><th>Самоцвет в сокете</th><th class="num">Гем отдельно</th>
          <th class="num">Аркана + гем</th><th class="num">Выгода</th></tr></thead>
          <tbody>%%ROWS%%</tbody></table>
          <div class="foot">
          <b>Как считается.</b> Выгода = (самый дешёвый лот арканы + цена этого гема по фактическим
          продажам Steam) &minus; цена готового лота. Процент &mdash; скидка к сборке того же вида.<br>
          <b>Цена гема</b> берётся по медиане последних продаж: на тонком рынке одна заявка цену не
          делает &mdash; она её придумывает. Свежих продаж нет &mdash; берём последнюю зафиксированную
          (дата указана), нет и её &mdash; самую дешёвую заявку, и лот помечен &laquo;по предложению&raquo;.
          В карточки такие лоты попадают, только если выгодных лотов с оценкой по продажам нет вовсе.<br>
          Прайзматический сокет есть только у одной арканы &mdash; Terrorblade
          (Fractal Horns of Inner Abysm). В остальные арканы гем не вставить.<br>
          <b>Важно:</b> при замене гема старый уничтожается, а Steam берёт 15% при продаже &mdash; это экономия
          на сборке, а не арбитраж. Лоты уникальны: конкретный лот с нужным гемом уйдёт.<br>
          Дефолтный гем (Terrorblade &mdash; Reflection's Shade) в таблицу не попадает:
          это штатная комплектация, а не апгрейд. Полная версия с фильтрами, историей цен и CSV &mdash;
          Docker-образ из того же проекта.
          </div></div>
          <script>
          var t=document.getElementById('t');
          var rows=[].slice.call(t.tBodies[0].rows);
          function f(){
            var q=(document.getElementById('q').value||'').toLowerCase();
            var s=document.getElementById('s').value;
            var key=s=='price'?'price':(s=='pct'?'pct':'save');
            rows.sort(function(a,b){return (+b.dataset[key])-(+a.dataset[key]);});
            rows.forEach(function(r){
              t.tBodies[0].appendChild(r);
              r.style.display=((r.dataset.gem||'').indexOf(q)>-1)?'':'none';
            });
          }
          </script></body></html>
          """

          try:
              main()
          except BaseException as e:
              import traceback
              log("СБОЙ: " + "".join(traceback.format_exception(type(e), e, e.__traceback__)).replace("\n", " / "))
              flush_log()
              raise
          flush_log()
          PY

      - name: Опубликовать страницу в ветку main
        if: always()
        run: |
          if [ ! -f public/index.html ]; then
            echo "скан не собрал страницу — нечего публиковать"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Прогоны иногда накладываются друг на друга: диспатч приходит каждые
          # 10 минут, а пуш в main запускает ещё один прогон. Если main ушёл
          # вперёд — встаём на свежий main и кладём свой снимок сверху: наш
          # снимок лежит в public/ и от git не зависит, поэтому конфликта
          # быть не может. Терять свежий снимок нельзя — как раз на таком
          # прогоне Steam мог и пустить.
          for try in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            cp public/index.html index.html
            # цены последних продаж самоцветов живут в main рядом со снимком: без них
            # тонкому рынку снова осталась бы одна заявка вместо последней сделки
            cp public/gem-prices.json gem-prices.json 2>/dev/null || true
            git add index.html
            git add gem-prices.json 2>/dev/null || true
            git rm -q --cached scan.log scan-state.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "index.html не изменился"
              exit 0
            fi
            git commit -q -m "Дашборд: снимок рынка [skip ci]"
            if git push -q origin HEAD:main; then
              echo "опубликовано в main"
              exit 0
            fi
            echo "пуш отклонён (попытка $try) — main снова поменялся, пробуем ещё"
          done
          echo "не удалось опубликовать за 3 попытки — снимок опубликует следующий прогон"
          exit 0

      - name: Сохранить журнал скана
        if: always()
        run: |
          git checkout -q -B scan-log
          git add -f scan.log
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "журнал скана [skip ci]" || echo "нечего коммитить"
          git push -q -f origin HEAD:scan-log || echo "пуш журнала не удался"

